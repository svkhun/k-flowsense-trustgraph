<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-k-emerald" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F59B" />
      <stop offset="0.55" stop-color="#00A950" />
      <stop offset="1" stop-color="#005227" />
    </linearGradient>
    <linearGradient id="fav-k-mint" x1="12" y1="6" x2="28" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fav-shield-wire" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F59B" stop-opacity="0.45" />
      <stop offset="1" stop-color="#00A950" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background rounded capsule -->
  <rect width="32" height="32" rx="7" fill="#070B14" />

  <!-- Minimal Shield Wireframe Outline -->
  <path 
    d="M16 4.5 L25 8.5 V14.5 C25 20.5 21 25.4 16 27 C11 25.4 7 20.5 7 14.5 V8.5 L16 4.5 Z" 
    stroke="url(#fav-shield-wire)" 
    stroke-width="1.2" 
    stroke-linejoin="round" 
    fill="rgba(0, 169, 80, 0.05)"
  />

  <!-- Vertical Financial Core Ledger -->
  <rect 
    x="9.5" 
    y="8.5" 
    width="2.6" 
    height="15" 
    rx="1.3" 
    fill="url(#fav-k-emerald)" 
  />

  <!-- FlowSense Wave Arc -->
  <path 
    d="M14 16 C15.5 14 17.5 11.2 21.5 8.5 C22.2 8 23.4 8.3 23.7 9.2 C24 10.2 23.4 11.1 22.5 11.8 C19.5 14 17.5 16.2 15.8 17.5" 
    stroke="url(#fav-k-mint)" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- TrustGraph Defense Vector -->
  <path 
    d="M14.2 15.2 L22.8 23.8" 
    stroke="url(#fav-k-emerald)" 
    stroke-width="2.2" 
    stroke-linecap="round" 
  />

  <!-- Real-time AI Nexus Node -->
  <circle cx="14.2" cy="15.8" r="1.4" fill="#FFFFFF" />
  <circle cx="14.2" cy="15.8" r="0.8" fill="#00F59B" />
